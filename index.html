<!DOCTYPE html>
<html lang="id" data-tema="gelap">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E131A">
<title>Public Space Analysis · BLOK M</title>
<meta name="description" content="Analisis ruang publik kawasan inti Blok M, Jakarta Selatan, dengan kerangka Place Diagram Project for Public Spaces: akses dan keterhubungan, kenyamanan dan citra, kegunaan dan aktivitas, serta sosiabilitas. Peta 3D interaktif dari data OpenStreetMap.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Crect width=%2248%22 height=%2248%22 rx=%2214%22 fill=%22%2316A99A%22/%3E%3Cpath d=%22M24 9.3l5.4 3.1L24 15.5l-5.4-3.1z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M29.4 26L24 29.1V15.5l5.4-3.1z%22 fill=%22%23fff%22 fill-opacity=%22.7%22/%3E%3Cpath d=%22M18.6 26l5.4 3.1V15.5l-5.4-3.1z%22 fill=%22%23fff%22 fill-opacity=%22.45%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* =========================================================
   Token tema
   ========================================================= */
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r1:10px;--r2:14px;--r3:20px;--r4:26px;
  --ease:cubic-bezier(.22,1.15,.36,1);--ease2:cubic-bezier(.65,0,.35,1);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --tepi:16px;--sela:14px;--rail:276px;--pw:392px;--dok:66px;--atas:76px;
  --c:var(--aksen);
}
[data-tema=gelap]{
  --bg:#0E131A;--kartu:rgba(19,25,33,.80);--kartu-solid:#17202A;--kartu-2:#1D2733;
  --ink:#E9EEF4;--ink2:#C3CCD7;--redam:#8D99A8;--garis:rgba(255,255,255,.075);--garis2:rgba(255,255,255,.13);--lembut:rgba(255,255,255,.055);
  --aksen:#3DD6C0;--aksen-ink:#052824;--tint:rgba(61,214,192,.12);
  --ok:#4ADE9B;--no:#FF8E7E;--warn:#F6C760;
  --a-akses:#72AEFF;--a-nyaman:#52D69E;--a-guna:#F6BC5C;--a-sosial:#F384AE;
  --bayang:0 20px 44px -24px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.065) inset;
  --bayang-kecil:0 8px 20px -12px rgba(0,0,0,.7);
  --tip:#E9EEF4;--tip-ink:#0E131A;color-scheme:dark;
}
[data-tema=terang]{
  --bg:#EEF2F6;--kartu:rgba(255,255,255,.86);--kartu-solid:#FFFFFF;--kartu-2:#F4F6F9;
  --ink:#16202B;--ink2:#3D4958;--redam:#6A7584;--garis:#E2E7EE;--garis2:#D3DAE3;--lembut:#EEF2F6;
  --aksen:#0E9F8A;--aksen-ink:#FFFFFF;--tint:rgba(14,159,138,.10);
  --ok:#14A067;--no:#DE503A;--warn:#C3860E;
  --a-akses:#3B82E6;--a-nyaman:#16A870;--a-guna:#D9931A;--a-sosial:#D9497F;
  --bayang:0 16px 36px -22px rgba(30,45,70,.5),0 0 0 1px rgba(255,255,255,.75) inset;
  --bayang-kecil:0 8px 18px -12px rgba(30,45,70,.45);
  --tip:#16202B;--tip-ink:#FFFFFF;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;touch-action:manipulation;font-size:14px}
h1,h2,h3,h4,p{margin:0}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--aksen)}
:focus-visible{outline:2.5px solid var(--c);outline-offset:2px;border-radius:var(--r1)}
#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;outline:none;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1;--ink:#16202B;--bg:#EEF2F6;--kartu-solid:#FFFFFF;--tip:#16202B;--tip-ink:#FFFFFF;--aksen:#0E9F8A;--aksen-ink:#FFFFFF;--garis:#E2E7EE;--bayang-kecil:0 8px 18px -12px rgba(30,45,70,.45)}
.kartu{background:var(--kartu);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);border-radius:var(--r3);box-shadow:var(--bayang)}
.ui{position:fixed;z-index:5}
.ikon{display:inline-grid;place-items:center}
svg.i{width:18px;height:18px;flex:none}

/* =========================================================
   Label 3D
   ========================================================= */
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:700 11.5px var(--font);color:var(--ink);will-change:transform;transition:opacity .25s}
.lbl.redup{opacity:0}
.lbl.transit{display:flex;align-items:center;gap:6px;margin:-11px 0 0 -11px;background:var(--kartu-solid);padding:3px 10px 3px 3px;border-radius:999px;box-shadow:var(--bayang-kecil),0 0 0 1px var(--garis) inset;font-size:11px}
.pin{width:16px;height:16px;border-radius:50%;border:3px solid var(--kartu-solid);box-shadow:0 0 0 1.5px currentColor}
.pin.mrt{background:#FF7A59;color:#FF7A59}.pin.tj{background:#5B9BFF;color:#5B9BFF}
.lbl.landmark{display:flex;flex-direction:column;align-items:center;margin-top:-44px;translate:-50% 0;background:var(--tip);color:var(--tip-ink);padding:5px 11px;border-radius:12px;font-size:11.5px;font-weight:800;pointer-events:auto;cursor:pointer;box-shadow:var(--bayang-kecil)}
.lbl.landmark span{font:600 10px var(--font);opacity:.7}
.lbl.landmark::after{content:'';position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--tip);border-bottom:0}
.lbl.tempat{translate:-50% -50%;font:800 10.5px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-shadow:0 0 4px var(--bg),0 0 8px var(--bg),0 0 12px var(--bg)}
.lbl.zona{translate:-50% -50%;background:var(--aksen);color:var(--aksen-ink);padding:4px 12px;border-radius:999px;font:800 11px var(--font);box-shadow:0 8px 20px -10px var(--aksen)}
.lbl.ring{translate:-50% -50%;background:var(--tip);color:var(--tip-ink);padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:800}

/* =========================================================
   Brand & toolbar atas
   ========================================================= */
.brand{left:var(--tepi);top:calc(var(--tepi) + var(--safe-t));height:56px;padding:0 16px 0 8px;display:flex;align-items:center;gap:11px;border-radius:var(--r3)}
.logo{width:42px;height:42px;flex:none;border-radius:13px;display:block;filter:drop-shadow(0 8px 14px rgba(22,169,154,.35))}
.logo .cincin{transform-origin:24px 30px;animation:putar 14s linear infinite}
.logo .org{animation:denyut 2.4s ease-in-out infinite}
.logo .org:nth-of-type(2){animation-delay:.6s}.logo .org:nth-of-type(3){animation-delay:1.2s}.logo .org:nth-of-type(4){animation-delay:1.8s}
@keyframes putar{to{transform:rotate(360deg)}}
@keyframes denyut{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-.8px)}}
.brand h1{font-size:15px;font-weight:800;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.brand h1 b{display:block;font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--aksen);margin-top:2px}
.alat{right:var(--tepi);top:calc(var(--tepi) + var(--safe-t));display:flex;gap:8px;align-items:center;z-index:9}
.grup{display:flex;gap:2px;padding:5px;border-radius:var(--r2);height:48px;align-items:center}
.tb{border:0;background:none;border-radius:var(--r1);height:38px;padding:0 12px;font:700 12.5px var(--font);color:var(--ink2);display:flex;align-items:center;gap:7px;transition:background .2s,color .2s,transform .35s var(--ease);white-space:nowrap;position:relative}
.tb:hover{background:var(--lembut);color:var(--ink)}
.tb:active{transform:scale(.95)}
.tb.on{background:var(--aksen);color:var(--aksen-ink)}
.tb.kotak{width:38px;padding:0;justify-content:center}
.tb .ekor{font-size:11px;opacity:.75}
#grup-view .tb svg{width:16px;height:16px}
.view-dd{display:none}

/* =========================================================
   Menu bertingkat (Menu > Submenu > Opsi)
   ========================================================= */
.menu{position:absolute;top:56px;right:0;width:300px;padding:8px;overflow:hidden;transform-origin:top right;border-radius:var(--r3);background:var(--kartu-solid)}
.menu[hidden]{display:none}
.menu.buka{animation:muncul .38s var(--ease)}
@keyframes muncul{from{opacity:0;transform:scale(.9) translateY(-8px)}to{opacity:1;transform:none}}
.menu-kepala{display:flex;align-items:center;gap:6px;padding:4px 4px 8px;border-bottom:1px solid var(--garis);margin-bottom:6px;min-height:42px}
.menu-kepala h3{font-size:14px;font-weight:800;flex:1}
.menu-kepala .jejak{font:600 10.5px var(--font);color:var(--redam);display:block}
.menu-level{display:flex;flex-direction:column;gap:2px;max-height:min(62vh,520px);overflow-y:auto;scrollbar-width:thin}
.mi{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;border:0;background:none;width:100%;text-align:left;padding:8px 8px;border-radius:var(--r2);font:700 13px var(--font);color:var(--ink);transition:background .2s,transform .3s var(--ease)}
.mi:hover,.mi:focus-visible{background:var(--lembut)}
.mi:hover .panah{transform:translateX(3px)}
.mi .ik{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--lembut);color:var(--ink2)}
.mi small{display:block;font:600 11px var(--font);color:var(--redam);margin-top:1px}
.mi .panah{color:var(--redam);transition:transform .3s var(--ease)}
.mi .cek{width:20px;height:20px;border-radius:50%;border:2px solid var(--garis2);display:grid;place-items:center}
.mi.on .cek{background:var(--aksen);border-color:var(--aksen);color:var(--aksen-ink)}
.mi .sakelar{width:38px;height:22px;border-radius:999px;background:var(--garis2);position:relative;transition:background .25s}
.mi .sakelar::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .35s var(--ease);box-shadow:0 2px 5px rgba(0,0,0,.3)}
.mi.on .sakelar{background:var(--aksen)}.mi.on .sakelar::after{transform:translateX(16px)}
.menu-label{font:800 10px var(--font);color:var(--redam);text-transform:uppercase;letter-spacing:.1em;padding:10px 10px 4px}

/* =========================================================
   Rel atribut & lensa (desktop)
   ========================================================= */
.rel{left:var(--tepi);top:calc(var(--tepi) + 56px + 12px + var(--safe-t));bottom:var(--tepi);width:var(--rail);padding:8px;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:2px}
.rel::-webkit-scrollbar{display:none}
.rel>*{flex-shrink:0}
.atr{margin-top:6px}
.atr-kepala{width:100%;display:grid;grid-template-columns:6px 1fr auto 18px;gap:10px;align-items:center;border:0;background:none;padding:9px 8px 9px 6px;border-radius:var(--r2);text-align:left;font:800 12.5px var(--font);color:var(--ink);transition:background .2s}
.atr-kepala:hover{background:var(--lembut)}
.atr-kepala i{width:6px;height:28px;border-radius:4px;background:var(--k)}
.atr-kepala small{display:block;font:600 10.5px var(--font);color:var(--redam);letter-spacing:.02em}
.atr-kepala .chev{color:var(--redam);transition:transform .35s var(--ease)}
.atr.lipat .chev{transform:rotate(-90deg)}
.atr-isi{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s var(--ease2)}
.atr.lipat .atr-isi{grid-template-rows:0fr}
.atr-isi>div{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:2px;transition:opacity .3s,visibility .4s}
.atr.lipat .atr-isi>div{opacity:0;visibility:hidden}
.skor{font:800 11px var(--font);font-variant-numeric:tabular-nums;color:var(--ink2);background:var(--lembut);border-radius:999px;padding:3px 8px;min-width:34px;text-align:center}
.atr-kepala.on{background:var(--lembut);box-shadow:0 0 0 1.5px var(--k) inset}
.atr-kepala.on .skor,.lensa.on .skor{background:var(--k);color:#0E131A}
.lensa{width:100%;display:grid;grid-template-columns:32px 1fr auto 22px;align-items:center;gap:10px;border:0;background:none;border-radius:var(--r2);padding:6px 6px 6px 10px;text-align:left;font:700 13px var(--font);color:var(--ink);transition:background .25s,transform .35s var(--ease)}
.lensa small{display:block;font:600 10.5px var(--font);color:var(--redam);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lensa>span{min-width:0}
.lensa i{width:32px;height:32px;border-radius:var(--r1);display:grid;place-items:center;color:var(--k);background:color-mix(in srgb,var(--k) 16%,transparent);font-style:normal;transition:transform .45s var(--ease),background .3s,color .3s}
.lensa i svg{width:17px;height:17px}
.lensa:hover{background:var(--lembut)}
.lensa:hover i{transform:translateY(-1px) scale(1.05)}
.lensa.on{background:var(--kartu-2);box-shadow:0 0 0 1.5px var(--k) inset}
.lensa.on i{background:var(--k);color:#0E131A;transform:rotate(-6deg) scale(1.05)}
.info-btn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--redam);font:800 11px var(--font);border:1.5px solid var(--garis2);opacity:0;transition:opacity .2s,color .2s,border-color .2s}
.lensa:hover .info-btn,.lensa.on .info-btn,.lensa:focus-visible .info-btn{opacity:1}
.info-btn:hover{color:var(--k);border-color:var(--k)}
.lensa.induk{grid-template-columns:32px 1fr auto 22px;margin-bottom:2px}

/* =========================================================
   Panel analisis
   ========================================================= */
.panel{right:var(--tepi);top:calc(var(--tepi) + 56px + 12px + var(--safe-t));bottom:var(--tepi);width:var(--pw);display:flex;flex-direction:column;overflow:hidden;transition:transform .5s var(--ease)}
.panel-isi{flex:1;overflow-y:auto;padding:18px 18px 24px;scrollbar-width:thin;overscroll-behavior:contain}
.panel-kepala{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font:800 10.5px var(--font);color:var(--c);text-transform:uppercase;letter-spacing:.09em}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.btn-metode{flex:none;border:0;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;font:700 11.5px var(--font);background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);transition:transform .3s var(--ease),background .2s}
.btn-metode:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--c) 24%,transparent)}
.panel h2{font-size:21px;font-weight:800;line-height:1.18;margin:8px 0 7px;letter-spacing:-.015em}
.lede{font:500 13.5px/1.6 var(--font);color:var(--ink2)}
.lede b{color:var(--ink);font-weight:700}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.kpi{background:var(--kartu-2);border-radius:var(--r2);padding:12px 12px 11px 14px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c);opacity:.9}
.kpi b{display:block;font-size:21px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi b small{font-size:11.5px;font-weight:700;color:var(--redam);margin-left:2px}
.kpi>span{display:block;font:600 11px/1.35 var(--font);color:var(--redam);margin-top:5px}
.kpi.status-ok::before{background:var(--ok)}.kpi.status-no::before{background:var(--no)}
.chart-box{background:var(--kartu-2);border-radius:var(--r3);padding:12px 8px 4px;margin:12px 0 4px}
.chart-box h3{font:800 12px var(--font);padding:0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chart-box h3 span{font-weight:600;color:var(--redam);font-size:10.5px;text-align:right}
.chart{width:100%;height:210px}
.chart.tinggi{height:280px}
.tabel{width:100%;border-collapse:collapse;font:600 12px/1.35 var(--font);margin:4px 0 6px}
.tabel td{padding:6px 8px;border-top:1px solid var(--garis);color:var(--ink2)}
.tabel td:nth-child(2){text-align:right;white-space:nowrap;color:var(--ink);font-weight:700}
.tabel td:nth-child(3){font-size:10.5px;color:var(--redam)}
.temuan{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.temuan li{display:grid;grid-template-columns:22px 1fr;gap:9px;font:500 12.8px/1.55 var(--font);color:var(--ink2)}
.temuan li i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:800 11px var(--font);font-style:normal;color:#0E131A;background:var(--no)}
.temuan li i.rk{background:var(--ok)}
.temuan b{color:var(--ink);font-weight:700}
.sumber{font:500 11px/1.55 var(--font);color:var(--redam);margin-top:14px;padding-top:10px;border-top:1px dashed var(--garis2)}
.skenario{margin-top:12px;background:linear-gradient(135deg,var(--tint),transparent 70%),var(--kartu-2);border-radius:var(--r3);padding:13px 14px}
.skenario h4{font:800 13px var(--font);display:flex;align-items:center;gap:7px}
.skenario p{font:500 12px/1.5 var(--font);color:var(--ink2);margin-top:4px}
.skenario .tb{background:var(--lembut);height:32px;font-size:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font:700 12.5px var(--font)}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--garis2);border-radius:999px;transition:background .25s}
.sw span::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s var(--ease)}
.sw input:checked+span{background:var(--c)}
.sw input:checked+span::after{transform:translateX(18px)}
.delta{display:inline-flex;align-items:center;gap:4px;font:800 12px var(--font);border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);margin-top:8px}
.rentang{width:100%;accent-color:var(--c);margin-top:8px}
.seg{display:flex;gap:2px;background:var(--lembut);border-radius:999px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 6px;font:700 11.5px var(--font);color:var(--ink2);transition:background .2s,color .2s}
.seg button.on{background:var(--c);color:#0E131A}
select{border:0;background:var(--lembut);border-radius:var(--r1);padding:8px 10px;font:700 12px var(--font);color:var(--ink)}
select option{background:var(--kartu-solid);color:var(--ink)}
/* indikator PPS */
.ind{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border-radius:var(--r2);background:var(--kartu-2);margin-top:6px;align-items:center}
.ind b{font:700 12.5px var(--font)}
.ind .nil{font:800 12.5px var(--font);font-variant-numeric:tabular-nums;text-align:right}
.ind .bar{grid-column:1/-1;height:6px;border-radius:4px;background:var(--lembut);overflow:hidden}
.ind .bar i{display:block;height:100%;border-radius:4px;background:var(--c);transform-origin:left;animation:isi-bar .9s var(--ease) both}
@keyframes isi-bar{from{transform:scaleX(0)}}
.ind small{grid-column:1/-1;font:500 10.5px/1.45 var(--font);color:var(--redam)}
.ind a{font-weight:700;text-decoration:none}
.chipset{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chipset span{font:600 11px var(--font);padding:4px 10px;border-radius:999px;background:var(--lembut);color:var(--ink2)}
.chipset span.belum{background:none;box-shadow:0 0 0 1px var(--garis2) inset;color:var(--redam)}
.subjudul{font:800 11px var(--font);color:var(--redam);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 4px}
.banding{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.banding>div{border-radius:var(--r3);padding:14px;background:var(--kartu-2);position:relative;overflow:hidden}
.banding b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.banding>div>span{display:block;font:600 11px/1.4 var(--font);color:var(--redam);margin-top:6px}
.banding em{font-style:normal;font:800 10.5px var(--font);text-transform:uppercase;letter-spacing:.08em}

/* =========================================================
   Dok waktu, legenda, kompas, info
   ========================================================= */
.dok{left:calc(var(--tepi) + var(--rail) + var(--sela));right:calc(var(--tepi) + var(--pw) + var(--sela));bottom:calc(var(--tepi) + var(--safe-b));height:var(--dok);padding:9px 12px 9px 10px;display:grid;grid-template-columns:auto auto 1fr auto auto;gap:12px;align-items:center;transition:right .5s var(--ease)}
.main{width:44px;height:44px;border-radius:50%;border:0;background:var(--aksen);color:var(--aksen-ink);display:grid;place-items:center;transition:transform .3s var(--ease);box-shadow:0 8px 20px -10px var(--aksen)}
.main:hover{transform:scale(1.07)}
.main.on{animation:nafas 2s ease-in-out infinite}
@keyframes nafas{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--aksen) 20%,transparent)}}
.jam b{display:block;font:800 21px var(--font);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.01em}
.jam span{font:600 10.5px var(--font);color:var(--redam);white-space:nowrap}
.trek{position:relative;height:42px;min-width:100px}
.trek svg{position:absolute;inset:0;width:100%;height:100%}
#slider{position:absolute;inset:0;width:100%;height:42px;appearance:none;background:transparent;margin:0}
#slider::-webkit-slider-runnable-track{height:42px;background:transparent}
#slider::-webkit-slider-thumb{appearance:none;width:5px;height:42px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 3px var(--kartu-solid)}
#slider::-moz-range-thumb{width:5px;height:42px;border-radius:3px;border:0;background:var(--ink);box-shadow:0 0 0 3px var(--kartu-solid)}
.mrt-chip{display:flex;align-items:center;gap:8px;font:700 11px/1.25 var(--font);color:var(--ink2);background:var(--lembut);border-radius:var(--r2);padding:6px 10px;white-space:nowrap}
.mrt-chip i{width:8px;height:8px;border-radius:50%;background:#FF7A59;box-shadow:0 0 0 3px rgba(255,122,89,.2)}
.mrt-chip.henti i{animation:kedip 1s infinite}
@keyframes kedip{50%{opacity:.25}}
.mrt-chip b,.lalin-chip b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.lalin-chip{display:flex;flex-direction:column;gap:1px;font:600 10.5px/1.3 var(--font);color:var(--ink2);white-space:nowrap}
@media (max-width:1499px){.lalin-chip{display:none}}
.legenda{left:calc(var(--tepi) + var(--rail) + var(--sela));bottom:calc(var(--tepi) + var(--dok) + 10px + var(--safe-b));padding:12px 14px;width:228px;border-radius:var(--r2)}
.legenda:empty{display:none}
.legenda b{font:800 12px var(--font);display:block;margin-bottom:6px}
.sk{height:8px;border-radius:6px;margin:5px 0 3px}
.tk{display:flex;justify-content:space-between;font:600 10.5px var(--font);color:var(--redam)}
.li{display:flex;align-items:center;gap:8px;font:600 11.5px var(--font);color:var(--ink2);margin:4px 0}
.li i{width:11px;height:11px;border-radius:4px;flex:none}
.probe{position:fixed;z-index:8;pointer-events:none;background:var(--tip);color:var(--tip-ink);border-radius:12px;padding:8px 12px;font:600 12px/1.45 var(--font);max-width:250px;opacity:0;transform:translate(14px,-50%) scale(.96);transition:opacity .15s,transform .2s var(--ease);box-shadow:var(--bayang-kecil)}
.probe.on{opacity:1;transform:translate(14px,-50%) scale(1)}
.probe b{font-weight:800}.probe .tg{opacity:.7}
.kompas{right:calc(var(--tepi) + var(--pw) + var(--sela));bottom:calc(var(--tepi) + var(--dok) + 10px + var(--safe-b));width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:0;transition:right .5s var(--ease)}
#utara{width:34px;height:34px}
.info{right:calc(var(--tepi) + var(--pw) + var(--sela));top:calc(var(--tepi) + 56px + 12px + var(--safe-t));width:300px;padding:16px;animation:muncul .35s var(--ease)}
.info[hidden]{display:none}
.info h3{font-size:17px;font-weight:800;margin:8px 0 2px;line-height:1.2;padding-right:30px}
.info .x{position:absolute;right:10px;top:10px;border:0;background:var(--lembut);width:30px;height:30px;border-radius:50%;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:800 10.5px var(--font)}

/* =========================================================
   Tur cerita
   ========================================================= */
.cerita{left:calc(var(--tepi) + var(--rail) + var(--sela));right:calc(var(--tepi) + var(--pw) + var(--sela));top:calc(var(--tepi) + 56px + 12px + var(--safe-t));margin:0 auto;max-width:560px;padding:16px 18px 14px;animation:muncul .4s var(--ease)}
.cerita[hidden]{display:none}
.cerita .langkah{font:800 10.5px var(--font);color:var(--c);text-transform:uppercase;letter-spacing:.09em}
.cerita h3{font-size:18px;font-weight:800;margin:4px 0 4px}
.cerita p{font:500 13.2px/1.55 var(--font);color:var(--ink2)}
.cerita .nav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
.titik{display:flex;gap:4px;flex:1}
.titik i{height:4px;flex:1;border-radius:3px;background:var(--garis2);overflow:hidden;position:relative}
.titik i.on::after{content:'';position:absolute;inset:0;background:var(--c);transform-origin:left;animation:isi var(--d,7s) linear forwards}
.titik i.lewat{background:var(--c)}
@keyframes isi{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.btn{border:0;border-radius:var(--r2);height:38px;padding:0 15px;font:700 12.5px var(--font);background:var(--lembut);color:var(--ink);display:inline-flex;align-items:center;gap:7px;transition:transform .3s var(--ease),background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.primer{background:var(--aksen);color:var(--aksen-ink)}
.btn:disabled{opacity:.4}

/* =========================================================
   Dialog: panduan, metodologi, lokasi
   ========================================================= */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(6,10,16,.5);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;animation:pudar .3s}
@keyframes pudar{from{opacity:0}}
.overlay[hidden]{display:none}
.dialog{background:var(--kartu-solid);border-radius:var(--r4);width:min(760px,100%);max-height:88vh;max-height:88dvh;overflow:auto;padding:26px;animation:muncul .45s var(--ease);box-shadow:0 40px 90px -30px rgba(0,0,0,.6),0 0 0 1px var(--garis) inset;position:relative}
.dialog h2{font-size:24px;font-weight:800;letter-spacing:-.02em;padding-right:44px}
.dialog h2 span{color:var(--aksen)}
.dialog>p.lede{margin-top:6px}
.tutup{position:absolute;right:18px;top:18px;border:0;background:var(--lembut);width:38px;height:38px;border-radius:50%;font:800 15px var(--font);z-index:2}
.langkah-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
.lk{background:var(--kartu-2);border-radius:var(--r3);padding:14px;animation:muncul .5s var(--ease) both}
.lk:nth-child(2){animation-delay:.07s}.lk:nth-child(3){animation-delay:.14s}.lk:nth-child(4){animation-delay:.21s}
.lk i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--aksen);font-style:normal}
.lk em{font-style:normal;font:800 10px var(--font);color:var(--redam);letter-spacing:.1em;display:block;margin-top:10px}
.lk b{display:block;font:800 13.5px var(--font);margin-top:2px}
.lk span b{display:inline}.lk span{display:block;font:500 12px/1.5 var(--font);color:var(--ink2);margin-top:5px}
.gestur{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.gestur div{font:600 11.5px/1.45 var(--font);color:var(--ink2);padding:10px 12px;border-radius:var(--r2);box-shadow:0 0 0 1px var(--garis2) inset}
.gestur b{display:block;color:var(--ink);font-weight:800;margin-bottom:2px}
.aksi{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.tab{display:flex;gap:4px;overflow-x:auto;margin:16px 0 4px;padding:3px;background:var(--lembut);border-radius:999px;scrollbar-width:none}
.tab button{flex:none;border:0;background:none;border-radius:999px;padding:8px 14px;font:700 12px var(--font);color:var(--ink2);white-space:nowrap}
.tab button.on{background:var(--aksen);color:var(--aksen-ink)}
.metode h3{font-size:14.5px;font-weight:800;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.metode h3 i{width:6px;height:16px;border-radius:3px;background:var(--k,var(--aksen))}
.metode p,.metode li{font:500 13px/1.65 var(--font);color:var(--ink2)}
.metode ul,.metode ol{padding-left:20px;margin:4px 0}
.metode b{color:var(--ink)}
.rumus{font:600 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--kartu-2);border-radius:var(--r2);padding:10px 12px;color:var(--ink);margin:6px 0;overflow-x:auto;white-space:pre-wrap}
.metode table{width:100%;border-collapse:collapse;font:500 12px/1.45 var(--font);margin:6px 0}
.metode td,.metode th{text-align:left;padding:6px 8px;border-top:1px solid var(--garis);vertical-align:top;color:var(--ink2)}
.metode th{font-weight:800;color:var(--ink);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tag{display:inline-block;font:800 10px var(--font);padding:2px 8px;border-radius:999px;letter-spacing:.05em}
.tag.ukur{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.model{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.survei{background:color-mix(in srgb,var(--no) 16%,transparent);color:var(--no)}

#memuat{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;font:700 13px var(--font);color:var(--redam);transition:opacity .9s .3s,visibility 0s 1.3s}
#memuat.hilang{opacity:0;visibility:hidden}
#memuat .logo{width:72px;height:72px;animation:melayang 2.4s var(--ease2) infinite}
@keyframes melayang{50%{transform:translateY(-6px)}}
.bar-muat{width:180px;height:4px;border-radius:3px;background:var(--garis2);overflow:hidden}
.bar-muat i{display:block;height:100%;width:30%;background:var(--aksen);border-radius:3px;animation:muat 1.2s infinite var(--ease2)}
@keyframes muat{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}

/* =========================================================
   Navigasi bawah & lembar (HP)
   ========================================================= */
.navbawah,.sheet,.panel-toggle{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chips .lensa{width:auto;grid-template-columns:28px auto;padding:4px 13px 4px 4px;border-radius:999px;background:var(--lembut);font-size:12.5px;scroll-snap-align:start;flex:none}
.chips .lensa i{width:28px;height:28px;border-radius:50%}
.chips .lensa i svg{width:15px;height:15px}
.chips .lensa small,.chips .lensa .skor,.chips .lensa .info-btn{display:none}


/* ---------- laptop kecil ---------- */
@media (max-width:1366px) and (min-width:1200px){:root{--rail:256px;--pw:360px}.lensa small{font-size:10px}}
/* ---------- tablet: rel ikon, panel bisa dilipat ---------- */
@media (min-width:768px) and (max-width:1199px) and (min-height:501px){
  .atr.lipat .atr-isi>div{opacity:1;visibility:visible}
  :root{--rail:74px;--pw:348px}
  .brand h1{font-size:13px}
  #grup-view .tb span{display:none}#grup-view .tb{width:38px;padding:0;justify-content:center}
  .rel{padding:8px 6px;align-items:center}
  .atr{width:100%}
  .atr-kepala{grid-template-columns:1fr;justify-items:center;padding:8px 0;gap:4px}
  .atr-kepala>span,.atr-kepala .chev{display:none}
  .atr-kepala i{width:26px;height:5px}
  .atr-kepala .skor{font-size:10px;padding:2px 6px;min-width:0}
  .atr.lipat .atr-isi{grid-template-rows:1fr}
  .lensa{grid-template-columns:1fr;justify-items:center;padding:6px 0;position:relative}
  .lensa>span,.lensa .skor,.lensa .info-btn{display:none}
  .lensa i{width:40px;height:40px;border-radius:12px}
  .lensa[data-tip]:hover::after{content:attr(data-tip);position:fixed;left:calc(var(--tepi) + var(--rail) + 8px);margin-top:-2px;background:var(--tip);color:var(--tip-ink);padding:6px 10px;border-radius:9px;font:700 12px var(--font);white-space:nowrap;z-index:20;pointer-events:none;animation:muncul .25s var(--ease)}
  .panel-toggle{display:grid;place-items:center;position:fixed;z-index:6;right:calc(var(--tepi) + var(--pw) - 6px);top:50%;width:26px;height:56px;margin-top:-28px;border:0;border-radius:12px 0 0 12px;transition:right .5s var(--ease)}
  body.panel-tutup .panel{transform:translateX(calc(100% + var(--tepi) + 4px))}
  body.panel-tutup{--pw:0px}
  body.panel-tutup .panel-toggle{right:0}
  .dok{grid-template-columns:auto auto 1fr}
  .dok .mrt-chip,.dok .lalin-chip{display:none}
  .legenda{width:200px}
}
/* ---------- HP potret & HP lanskap ---------- */
@media (max-width:767px),(max-height:500px) and (max-width:1000px){
  :root{--peek:182px;--nav:64px;--tepi:10px}
  .rel,.panel,.legenda,.panel-toggle{display:none!important}
  .brand{height:48px;padding:0 12px 0 6px;gap:8px}
  .brand .logo{width:36px;height:36px}
  .brand h1{font-size:12.5px}.brand h1 b{font-size:9.5px;letter-spacing:.18em}
  .alat{gap:6px}
  .grup{height:48px;padding:5px}
  #grup-view{display:none}
  .view-dd{display:block;position:relative}
  .lbl-tur{display:none}
  .menu{width:min(320px,calc(100vw - 20px));top:56px}
  .view-pop{background:var(--kartu-solid);position:absolute;top:56px;right:0;width:200px;padding:6px;display:flex;flex-direction:column;gap:2px;animation:muncul .3s var(--ease)}
  .view-pop[hidden]{display:none}
  .view-pop .tb{justify-content:flex-start}
  .kompas{right:var(--tepi);top:calc(66px + var(--safe-t));bottom:auto;width:42px;height:42px}
  .info{left:var(--tepi);right:var(--tepi);width:auto;top:auto;bottom:calc(var(--peek) + var(--nav) + var(--safe-b) + 10px)}
  .cerita{left:var(--tepi);right:var(--tepi);top:calc(66px + var(--safe-t));max-width:none}
  .cerita h3{font-size:16px}.cerita p{font-size:12.5px}
  .langkah-grid{grid-template-columns:1fr 1fr}
  .gestur{grid-template-columns:1fr}
  .dialog{padding:20px;border-radius:22px}
  .dialog h2{font-size:20px}
  .navbawah{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:7;height:calc(var(--nav) + var(--safe-b));padding:6px 6px calc(6px + var(--safe-b));border-radius:20px 20px 0 0;box-shadow:0 -10px 30px -18px rgba(0,0,0,.6),0 0 0 1px var(--garis) inset}
  .navbawah button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 10px var(--font);color:var(--redam);border-radius:14px;position:relative;transition:color .2s}
  .navbawah button svg{width:21px;height:21px;transition:transform .4s var(--ease)}
  .navbawah button.on{color:var(--k)}
  .navbawah button.on svg{transform:translateY(-2px) scale(1.1)}
  .navbawah button.on::before{content:'';position:absolute;top:2px;width:22px;height:3px;border-radius:2px;background:var(--k)}
  .sheet{--peek:182px;display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--safe-b));z-index:6;height:calc(100dvh - var(--nav) - var(--safe-b) - 70px - var(--safe-t));border-radius:24px 24px 0 0;transform:translateY(calc(100% - var(--peek)));transition:transform .55s var(--ease);will-change:transform}
  .sheet.half{transform:translateY(45%)}
  .sheet.full{transform:translateY(0)}
  .sheet.seret{transition:none}
  .pegangan{padding:9px 0 7px;display:grid;place-items:center;touch-action:none;cursor:grab}
  .pegangan i{width:44px;height:5px;border-radius:3px;background:var(--garis2)}
  .sheet .dok{position:static;transform:none;width:auto;min-width:0;left:auto;right:auto;bottom:auto;height:auto;margin:0 12px 10px;background:var(--kartu-2);box-shadow:none;grid-template-columns:auto auto 1fr;padding:6px 10px 6px 6px;gap:10px;border-radius:var(--r2)}
  .sheet .dok .main{width:38px;height:38px}.sheet .dok .jam b{font-size:17px}.sheet .dok .jam span{display:none}
  .sheet .dok .mrt-chip,.sheet .dok .lalin-chip{display:none}
  .sheet .panel-isi{padding:6px 16px 30px;flex:1;overflow-y:auto;touch-action:pan-y}
  .sheet .panel-isi h2{font-size:19px}
  .sheet .legenda-hp{margin:0 14px 8px}
  .legenda-isi{background:var(--kartu-2);border-radius:var(--r2);padding:9px 12px}
  .legenda-isi b{font:800 12px var(--font);display:block;margin-bottom:4px}
  .chart{height:190px}
}
@media (min-width:768px) and (min-height:501px),(min-width:1001px){.legenda-hp{display:none}}
/* HP lanskap: lembar lebih pendek */
@media (max-height:500px) and (max-width:1000px){:root{--peek:96px;--nav:52px}.sheet{--peek:96px}.sheet.half{transform:translateY(30%)}.sheet .chips{display:none}.navbawah button span{display:none}}
/* ---------- TV & layar sangat lebar ---------- */
@media (min-width:1800px){.ui,.overlay .dialog,.sheet,.navbawah{zoom:1.18}:root{--pw:420px}}
@media (min-width:2400px){.ui,.overlay .dialog{zoom:1.5}#labels{zoom:1}.lbl{font-size:14px}}
body.tv :focus-visible{outline-width:4px;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="ui alat" id="alat">

  </div>
